<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEXP Now Playing</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>KEXP Now Playing</h1>
      <div class="header-actions">
        <a href="https://www.kexp.org/playlist/" target="_blank" class="listen-link">
          Listen to livestream
        </a>
        <button id="spotify-login-btn" class="spotify-login-btn" style="display: none;">
          Login to Spotify
        </button>
        <div id="spotify-status" class="spotify-status" style="display: none;">
          <span class="status-dot"></span>
          <span class="status-text">Logged in to Spotify</span>
          <button id="spotify-logout-btn" class="spotify-logout-btn">Logout</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading">
      <p>Loading...</p>
    </div>

    <div id="error" class="error" style="display: none;">
      <p>Unable to load track information</p>
    </div>

    <div id="track-info" class="track-info" style="display: none;">
      <div class="track-content">
        <div class="details">
          <div class="track-name" id="track-name"></div>
          <div class="artist-name" id="artist-name"></div>
          <div class="album-name" id="album-name"></div>
          <div class="label-name" id="label-name"></div>
          <div class="airdate" id="airdate"></div>
        </div>

        <div id="album-art" class="album-art"></div>
      </div>

      <div id="comments" class="comments"></div>

      <div class="action-buttons">
        <div id="spotify-section" class="spotify-section">
          <button id="spotify-save-btn" class="spotify-save-btn" disabled>
            Save to Spotify
          </button>
          <div id="spotify-feedback" class="spotify-feedback"></div>
        </div>

        <div id="bandcamp-section" class="bandcamp-section">
          <a id="bandcamp-link" href="#" target="_blank" class="bandcamp-button">
            Find on Bandcamp
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="spotify-pkce.js"></script>
  <script src="spotify-auth.js"></script>
  <script src="spotify-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
